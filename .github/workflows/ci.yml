name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: atlas_innove_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_innove_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci_only_password@localhost:5432/atlas_innove_ci?schema=public
      SESSION_SECRET: ci-only-session-secret-not-for-production-0123456789
      REQUIRE_DOMAIN_DATABASE: "true"
      APP_BASE_URL: "https://innove.example.test"
      DEMO_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma validate
      - run: npm run db:migrate:deploy
      - run: npm run typecheck
      - run: npm run test:security
      - run: npm run test:domain
      - run: npm run test:demo
      - run: npm run build
