name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: atlas_innove_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_innove_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci_only_password@localhost:5432/atlas_innove_ci?schema=public
      SESSION_SECRET: ci-only-session-secret-not-for-production-0123456789
      REQUIRE_DOMAIN_DATABASE: "true"
      APP_BASE_URL: "https://innove.example.test"
      DEMO_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      INNOVE_MEDIA_BROWSER_TESTS: "true"
      OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:59000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: atlas-innove-social-ci
      OBJECT_STORAGE_ACCESS_KEY_ID: innove-ci-local
      OBJECT_STORAGE_SECRET_ACCESS_KEY: disposable-ci-media-storage-only
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache pinned local S3 test server
        id: media-store-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/atlas-innove-minio
          key: ${{ runner.os }}-${{ runner.arch }}-minio-7aac2a2c5b7c882e68c1ce017d8256be2feea27f-go1.24.8
      - uses: actions/setup-go@v5
        if: steps.media-store-cache.outputs.cache-hit != 'true'
        with:
          go-version: 1.24.8
          cache: false
      - name: Build pinned local S3 test server
        if: steps.media-store-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.cache/atlas-innove-minio"
          GOBIN="$HOME/.cache/atlas-innove-minio" GOMAXPROCS=2 go install github.com/minio/minio@7aac2a2c5b7c882e68c1ce017d8256be2feea27f
      - name: Start private local S3 test storage
        run: |
          MINIO_ROOT_USER="$OBJECT_STORAGE_ACCESS_KEY_ID" MINIO_ROOT_PASSWORD="$OBJECT_STORAGE_SECRET_ACCESS_KEY" "$HOME/.cache/atlas-innove-minio/minio" server "$RUNNER_TEMP/innove-media" --address 127.0.0.1:59000 --console-address 127.0.0.1:59001 > "$RUNNER_TEMP/innove-media.log" 2>&1 &
          node scripts/prepare-media-test-store.mjs
      - run: npm run db:generate
      - run: npx prisma validate
      - run: npm run db:migrate:deploy
      - run: npm run typecheck
      - run: npm run test:security
      - run: npm run test:domain
      - run: npm run test:social
      - run: npm run test:media
      - run: npm run test:imports
      - run: npm run test:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Verify production routing and institutional browser journeys
        env:
          INNOVE_BROWSER_OUTPUT: ${{ runner.temp }}/innove-browser-results
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/innove-runtime.log" 2>&1 &
          innove_runtime_pid=$!
          trap 'kill "$innove_runtime_pid" 2>/dev/null || true' EXIT
          npm run test:runtime || { cat "$RUNNER_TEMP/innove-runtime.log"; exit 1; }
          npm run test:browser || { cat "$RUNNER_TEMP/innove-runtime.log"; exit 1; }
      - name: Preserve runtime and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institutional-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/innove-runtime.log
            ${{ runner.temp }}/innove-media.log
            ${{ runner.temp }}/innove-browser-results
          retention-days: 14
